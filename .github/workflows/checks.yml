name: Portable control checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python encryption dependency
        run: sudo apt-get update && sudo apt-get install -y python3-cryptography
      - name: Check installer syntax
        run: for script in *.sh; do bash -n "$script"; done
      - name: Check Python syntax
        run: /usr/bin/python3 -m compileall -q control tests *.py
      - name: Check portable setup and action boundaries
        run: /usr/bin/python3 -m unittest discover -s tests -v
